  <!-- Suppress Google reCAPTCHA timeout errors BEFORE React's error overlay loads -->
  <script>
    window.addEventListener('error', function (e) {
      if (e.message && e.message.indexOf('reCAPTCHA') !== -1) {
        e.stopImmediatePropagation();
        e.preventDefault();
        return true;
      }
    });
    window.addEventListener('unhandledrejection', function (e) {
      var msg = (e.reason && e.reason.message) || (typeof e.reason === 'string' ? e.reason : '');
      if (msg.indexOf('reCAPTCHA') !== -1) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    });
  </script>
